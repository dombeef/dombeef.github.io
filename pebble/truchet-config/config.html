<!DOCTYPE html>
<html>

<head>
  <title>Truchet Clone Config</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #f4f4f7;
      padding: 16px;
      color: #333;
      margin: 0;
    }

    h2 {
      margin: 8px 0 12px;
    }

    .section {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    .section-title {
      font-weight: 800;
      font-size: 13px;
      color: #555;
      letter-spacing: .2px;
      text-transform: uppercase;
      margin: 0 0 10px 0;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .current-label {
      font-weight: 700;
      font-size: 14px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 50vw;
    }

    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid #ddd;
      flex: 0 0 auto;
    }

    .choose-btn {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .choose-btn:active {
      transform: scale(.97);
    }

    button#save {
      width: 100%;
      padding: 16px;
      background: #ff5500;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      margin-bottom: 24px;
    }

    /* Square Preview */
    canvas#preview {
      width: 100%;
      max-width: 300px;
      aspect-ratio: 1 / 1;
      height: auto;
      border-radius: 12px;
      border: 1px solid #e6e6e6;
      background: #fff;
      image-rendering: pixelated;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      display: block;
      margin: 0 auto;
      touch-action: manipulation;
      object-fit: contain;
    }

    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      line-height: 1.35;
      text-align: center;
    }

    /* Fixed Modal Pop-up */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      /* Center vertically for better reach */
      justify-content: center;
      padding: 16px;
      z-index: 9999;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 400px;
      /* Tightened for 8x8 look */
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid #eee;
    }

    .modal-title {
      font-weight: 800;
      font-size: 14px;
    }

    .modal-close {
      border: 0;
      background: transparent;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .modal-body {
      padding: 12px;
    }

    /* Rigid 8x8 Grid */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      /* Force 8 columns */
      gap: 4px;
      /* Smaller gap for small screens */
    }

    .color-tile {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-sizing: border-box;
    }

    .color-tile.selected {
      border: 2px solid #000;
      transform: scale(1.1);
      z-index: 2;
    }

    @media (max-width:380px) {
      body {
        padding: 12px;
      }

      .color-grid {
        gap: 2px;
      }

      /* Ultra-tight for small screens */
    }
  </style>
</head>

<body>
  <h2>Truchet Clone Settings</h2>

  <div class="section">
    <div class="section-title">Face Preview</div>
    <canvas id="preview"></canvas>
  </div>

  <div class="section">
    <div class="row">
      <div class="left">
        <div class="swatch" id="swatch-0"></div>
        <span class="current-label">Black Replacement</span>
      </div>
      <button class="choose-btn" type="button" data-open-picker="0">Choose</button>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <div class="left">
        <div class="swatch" id="swatch-2"></div>
        <span class="current-label">Grey Replacement</span>
      </div>
      <button class="choose-btn" type="button" data-open-picker="2">Choose</button>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <div class="left">
        <div class="swatch" id="swatch-1"></div>
        <span class="current-label">White Replacement</span>
      </div>
      <button class="choose-btn" type="button" data-open-picker="1">Choose</button>
    </div>
  </div>

  <button id="save">SAVE SETTINGS</button>

  <div class="modal-overlay" id="pickerOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="modal-header">
        <div class="modal-title" id="pickerTitle">Choose Color</div>
        <button class="modal-close" type="button" id="pickerClose">×</button>
      </div>
      <div class="modal-body">
        <div class="color-grid" id="pickerGrid"></div>
      </div>
    </div>
  </div>

      '#AA0000', '#AA0055', '#AA00AA', '#AA00FF', '#AA5500', '#AA5555', '#AA55AA', '#AA55FF',
      '#FF0000', '#FF0055', '#FF00AA', '#FF00FF', '#FF5500', '#FF5555', '#FF55AA', '#FF55FF',
      '#00AA00', '#00AA55', '#00AAAA', '#00AAFF', '#00FF00', '#00FF55', '#00FFAA', '#00FFFF',
      '#55AA00', '#55AA55', '#55AAAA', '#55AAFF', '#55FF00', '#55FF55', '#55FFAA', '#55FFFF',
      '#AAAA00', '#AAAA55', '#AAAAAA', '#AAAAFF', '#AAFF00', '#AAFF55', '#AAFFAA', '#AAFFFF',
      '#FFAA00', '#FFAA55', '#FFAAAA', '#FFAAFF', '#FFFF00', '#FFFF55', '#FFFFAA', '#FFFFFF'
    ];

    function hexToRgb(hex) {
      const h = hex.replace('#', '');
      return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
    }

    let selections = { color0: '#000000', color1: '#FFFFFF', color2: '#AAAAAA' };
    const labels = { 0: 'Black Replacement', 1: 'White Replacement', 2: 'Grey Replacement' };

    const exampleImg = new Image();
    exampleImg.src = "data:image/png;base64," + EXAMPLE_PNG_BASE64;

    const overlay = document.getElementById('pickerOverlay');
    const pickerTitle = document.getElementById('pickerTitle');
    const pickerGrid = document.getElementById('pickerGrid');
    const closeBtn = document.getElementById('pickerClose');
    const preview = document.getElementById('preview');
    const ctx = preview.getContext('2d', { willReadFrequently: true });

    const work = document.createElement('canvas');
    const wctx = work.getContext('2d', { willReadFrequently: true });

    function openPicker(id) {
      pickerTitle.textContent = labels[id];
      const current = selections[`color${id}`];
      pickerGrid.innerHTML = '';

      /* Maintain exact 8x8 layout */
      pebbleColors.forEach(color => {
        const t = document.createElement('div');
        t.className = 'color-tile';
        t.style.backgroundColor = color;
        if (color === current) t.classList.add('selected');
        t.onclick = () => {
          selections[`color${id}`] = color;
          document.getElementById(`swatch-${id}`).style.backgroundColor = color;
          closePicker();
          drawPreview();
        };
        pickerGrid.appendChild(t);
      });
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closePicker() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.querySelectorAll('[data-open-picker]').forEach(btn => {
      btn.addEventListener('click', () => openPicker(parseInt(btn.getAttribute('data-open-picker'), 10)));
    });

    closeBtn.addEventListener('click', closePicker);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closePicker(); });

    function setCanvasResolution() {
      const containerWidth = preview.clientWidth;
      const dpr = window.devicePixelRatio || 1;
      preview.width = containerWidth * dpr;
      preview.height = containerWidth * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      return containerWidth;
    }

    function isNear(r, g, b, rr, gg, bb, tol) {
      return Math.abs(r - rr) <= tol && Math.abs(g - gg) <= tol && Math.abs(b - bb) <= tol;
    }

    function drawPreview() {
      if (!exampleImg.naturalWidth) return;
      const cssSize = setCanvasResolution();
      work.width = exampleImg.naturalWidth;
      work.height = exampleImg.naturalHeight;
      wctx.drawImage(exampleImg, 0, 0);

      const imgData = wctx.getImageData(0, 0, work.width, work.height);
      const data = imgData.data;
      const c0 = hexToRgb(selections.color0);
      const c1 = hexToRgb(selections.color1);
      const c2 = hexToRgb(selections.color2);

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        if (isNear(r, g, b, 0, 0, 0, 10)) {
          data[i] = c0.r; data[i + 1] = c0.g; data[i + 2] = c0.b;
        } else if (isNear(r, g, b, 255, 255, 255, 10)) {
          data[i] = c1.r; data[i + 1] = c1.g; data[i + 2] = c1.b;
        } else if (isNear(r, g, b, 170, 170, 170, 10)) {
          data[i] = c2.r; data[i + 1] = c2.g; data[i + 2] = c2.b;
        }
      }
      wctx.putImageData(imgData, 0, 0);

      ctx.clearRect(0, 0, cssSize, cssSize);
      const center = cssSize / 2;
      const radius = (cssSize / 2) - 10;
      ctx.save();
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, Math.PI * 2);
      ctx.clip();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(work, center - radius, center - radius, radius * 2, radius * 2);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(center, center, radius + 1, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(0,0,0,0.1)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    document.getElementById('save').onclick = function () {
      const urlParams = new URLSearchParams(window.location.search);
      const return_to = urlParams.get('return_to') || 'pebblejs://close#';
      location.href = return_to + encodeURIComponent(JSON.stringify(selections));
    };

    document.getElementById('swatch-0').style.backgroundColor = selections.color0;
    document.getElementById('swatch-1').style.backgroundColor = selections.color1;
    document.getElementById('swatch-2').style.backgroundColor = selections.color2;

    exampleImg.onload = drawPreview;
    window.addEventListener('resize', drawPreview);
  </script>
</body>

</html>
