<!DOCTYPE html>
<html>
<head>
  <title>Truchet Clone Config</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f4f7; padding: 16px; color: #333; margin: 0; }
    h2 { margin: 8px 0 12px; text-align: center; }
    
    .section { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .section-title { font-weight: 800; font-size: 13px; color: #555; text-transform: uppercase; margin-bottom: 10px; }

    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .left { display: flex; align-items: center; gap: 10px; }
    
    .swatch { width: 30px; height: 30px; border-radius: 6px; border: 1px solid #ddd; cursor: pointer; }
    .current-label { font-weight: 700; font-size: 14px; }

    /* Circular Preview Mask */
    #preview {
      display: block;
      margin: 0 auto;
      width: 144px;
      height: 144px;
      border-radius: 50%; /* Circle Mask */
      border: 4px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background: #000;
    }

    button#save {
      width: 100%; padding: 16px; background: #ff5500; color: #fff;
      border: none; border-radius: 10px; font-size: 18px; font-weight: bold;
      cursor: pointer; margin-top: 10px;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 16px; width: 280px; padding: 12px; }
    .color-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
    .color-tile { aspect-ratio: 1; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); cursor: pointer; }
  </style>
</head>
<body>

  <h2>Truchet Clone</h2>

  <div class="section">
    <div class="section-title">Face Preview</div>
    <canvas id="preview" width="144" height="144"></canvas>
  </div>

  <div class="section">
    <div class="row">
      <div class="left">
        <div class="swatch" id="swatch-0" onclick="openPicker(0)"></div>
        <span class="current-label">Main Color</span>
      </div>
    </div>
    <div class="row">
      <div class="left">
        <div class="swatch" id="swatch-2" onclick="openPicker(2)"></div>
        <span class="current-label">Accent Color</span>
      </div>
    </div>
    <div class="row">
      <div class="left">
        <div class="swatch" id="swatch-1" onclick="openPicker(1)"></div>
        <span class="current-label">Background</span>
      </div>
    </div>
  </div>

  <button id="save">SAVE SETTINGS</button>

  <div class="modal-overlay" id="overlay" onclick="closePicker()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="color-grid" id="pickerGrid"></div>
    </div>
  </div>

  <script>
    const pebbleColors = [
      '#000000', '#000055', '#0000AA', '#0000FF', '#005500', '#005555', '#0055AA', '#0055FF',
      '#550000', '#550055', '#5500AA', '#5500FF', '#555500', '#555555', '#5555AA', '#5555FF',
      '#AA0000', '#AA0055', '#AA00AA', '#AA00FF', '#AA5500', '#AA5555', '#AA55AA', '#AA55FF',
      '#FF0000', '#FF0055', '#FF00AA', '#FF00FF', '#FF5500', '#FF5555', '#FF55AA', '#FF55FF',
      '#00AA00', '#00AA55', '#00AAAA', '#00AAFF', '#00FF00', '#00FF55', '#00FFAA', '#00FFFF',
      '#55AA00', '#55AA55', '#55AAAA', '#55AAFF', '#55FF00', '#55FF55', '#55FFAA', '#55FFFF',
      '#AAAA00', '#AAAA55', '#AAAAAA', '#AAAAFF', '#AAFF00', '#AAFF55', '#AAFFAA', '#AAFFFF',
      '#FFAA00', '#FFAA55', '#FFAAAA', '#FFAAFF', '#FFFF00', '#FFFF55', '#FFFFAA', '#FFFFFF'
    ];

    let selections = { color0: '#000000', color1: '#FFFFFF', color2: '#AAAAAA' };
    let activeId = 0;

    const previewImg = new Image();
    previewImg.src = "preview.png"; // Externalized for speed

    const canvas = document.getElementById('preview');
    const ctx = canvas.getContext('2d');
    const work = document.createElement('canvas');
    const wctx = work.getContext('2d');

    function hexToRgb(hex) {
      const h = hex.replace('#', '');
      return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
    }

    function openPicker(id) {
      activeId = id;
      const grid = document.getElementById('pickerGrid');
      grid.innerHTML = '';
      pebbleColors.forEach(color => {
        const t = document.createElement('div');
        t.className = 'color-tile';
        t.style.backgroundColor = color;
        t.onclick = () => {
          selections[`color${id}`] = color;
          document.getElementById(`swatch-${id}`).style.backgroundColor = color;
          closePicker();
          drawPreview();
        };
        grid.appendChild(t);
      });
      document.getElementById('overlay').classList.add('open');
    }

    function closePicker() { document.getElementById('overlay').classList.remove('open'); }

    function drawPreview() {
      if (!previewImg.complete) return;
      work.width = previewImg.width;
      work.height = previewImg.height;
      wctx.drawImage(previewImg, 0, 0);

      const imgData = wctx.getImageData(0, 0, work.width, work.height);
      const data = imgData.data;
      const c = [hexToRgb(selections.color0), hexToRgb(selections.color1), hexToRgb(selections.color2)];

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        // Targeting Black (0,0,0), White (255,255,255), and Grey (170,170,170)
        if (r < 50 && g < 50 && b < 50) { // Black
          data[i] = c[0].r; data[i+1] = c[0].g; data[i+2] = c[0].b;
        } else if (r > 200 && g > 200 && b > 200) { // White
          data[i] = c[1].r; data[i+1] = c[1].g; data[i+2] = c[1].b;
        } else if (r > 100 && r < 200) { // Grey
          data[i] = c[2].r; data[i+1] = c[2].g; data[i+2] = c[2].b;
        }
      }
      wctx.putImageData(imgData, 0, 0);
      ctx.clearRect(0,0,144,144);
      ctx.drawImage(work, 0, 0, 144, 144);
    }

    document.getElementById('save').onclick = function () {
      const urlParams = new URLSearchParams(window.location.search);
      const return_to = urlParams.get('return_to') || 'pebblejs://close#';
      location.href = return_to + encodeURIComponent(JSON.stringify(selections));
    };

    previewImg.onload = drawPreview;
    // Initial swatch colors
    document.getElementById('swatch-0').style.backgroundColor = selections.color0;
    document.getElementById('swatch-1').style.backgroundColor = selections.color1;
    document.getElementById('swatch-2').style.backgroundColor = selections.color2;
  </script>
</body>
</html>
